<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>One Piece Battleground – Sprite Viewer</title>
  <style>
    @font-face {
      font-family: 'VT323';
      src: url('../client/fonts/VT323.ttf') format('truetype');
    }
    * { box-sizing: border-box; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: 'VT323', monospace;
      font-size: 20px;
      margin: 0;
      padding: 24px;
    }
    h1 {
      font-size: 36px;
      color: #facc15;
      margin-top: 0;
      text-shadow: 2px 2px #000;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .status-bar {
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 6px;
      padding: 16px 20px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .badge-pass {
      background: #15803d;
      color: #f0fdf4;
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 22px;
      font-weight: bold;
    }
    .badge-fail {
      background: #b91c1c;
      color: #fef2f2;
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 22px;
      font-weight: bold;
    }
    .category-title {
      font-size: 28px;
      color: #38bdf8;
      border-bottom: 2px solid #334155;
      padding-bottom: 6px;
      margin-top: 32px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 16px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 6px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.1s, border-color 0.1s;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: #facc15;
      background: #243248;
    }
    .canvas-container {
      width: 72px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #090d16;
      border: 1px solid #334155;
      border-radius: 4px;
      margin-bottom: 8px;
    }
    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .sprite-name {
      font-size: 16px;
      text-align: center;
      color: #e2e8f0;
      word-break: break-word;
      line-height: 1.1;
    }
    .sprite-size {
      font-size: 14px;
      color: #94a3b8;
      margin-top: 4px;
    }
  </style>

  <!-- Nạp Shared Scripts -->
  <script src="../shared/00-namespace.js"></script>
  <script src="../shared/01-constants.js"></script>
  <script src="../shared/02-enums.js"></script>
  <script src="../shared/03-protocol.js"></script>
  <script src="../shared/04-keybinds.js"></script>
  <script src="../shared/05-rng.js"></script>
  <script src="../shared/10-data-fruits.js"></script>
  <script src="../shared/11-data-weapons.js"></script>
  <script src="../shared/12-data-items.js"></script>
  <script src="../shared/13-data-bosses.js"></script>
  <script src="../shared/14-data-islands.js"></script>
  <script src="../shared/15-data-boats.js"></script>
  <script src="../shared/16-data-zone.js"></script>
  <script src="../shared/20-rules-damage.js"></script>
  <script src="../shared/21-mapgen.js"></script>

  <!-- Nạp Client Core & Sprites Scripts -->
  <script src="../client/js/00-boot.js"></script>
  <script src="../client/js/02a-pixel-core.js"></script>
  <script src="../client/js/02b-palette.js"></script>
  <script src="../client/js/02c-sprites-chars.js"></script>
  <script src="../client/js/02d-sprites-items.js"></script>
  <script src="../client/js/02e-sprites-world.js"></script>
  <script src="../client/js/02f-sprites-fx.js"></script>
</head>
<body>

  <h1>ONE PIECE BATTLEGROUND – BỘ XEM SPRITE PIXEL</h1>

  <div class="status-bar" id="statusBar">
    <div>Đang nạp và đối chiếu sprite với data...</div>
  </div>

  <div id="content"></div>

  <script>
    window.addEventListener('DOMContentLoaded', function () {
      const OP = window.OP || {};
      const S = window.OP_SHARED || {};
      const SPR = OP.SPR || {};

      // Khoi tao sprite nguoi choi mau de hien thi
      const playerBase = SPR.player({ hat: '#eab308', shirt: '#dc2626', hair: '#18181b' });

      // 1. Kiem tra so khop data
      const missingList = [];
      let checkedCount = 0;

      // Kiem tra 29 trai
      for (const fId in (S.FRUITS || {})) {
        checkedCount++;
        if (!SPR.get(`fruit_${fId}`)) missingList.push(`fruit_${fId}`);
      }

      // Kiem tra 13 vu khi
      for (const wId in (S.WEAPONS || {})) {
        checkedCount++;
        if (!SPR.get(`weapon_${wId}`)) missingList.push(`weapon_${wId}`);
      }

      // Kiem tra 14 vat pham
      for (const iId in (S.ITEMS || {})) {
        checkedCount++;
        if (!SPR.get(`item_${iId}`)) missingList.push(`item_${iId}`);
      }

      // Kiem tra 4 thuyen
      for (const bId in (S.BOATS || {})) {
        checkedCount++;
        if (!SPR.get(`boat_${bId}`)) missingList.push(`boat_${bId}`);
      }

      // Cap nhat thanh trang thai
      const statusBar = document.getElementById('statusBar');
      if (missingList.length === 0) {
        statusBar.innerHTML = `
          <div><strong>ĐỐI CHIẾU DỮ LIỆU:</strong> Đã kiểm tra ${checkedCount} đối tượng từ data shared.</div>
          <div class="badge-pass">TẤT CẢ SPRITE HỢP LỆ (0 THIẾU)</div>
        `;
      } else {
        statusBar.innerHTML = `
          <div><strong>CẢNH BÁO:</strong> Thiếu ${missingList.length} sprite: ${missingList.join(', ')}</div>
          <div class="badge-fail">THIẾU SPRITE</div>
        `;
      }

      // 2. Render danh muc
      const categories = [
        {
          title: '1. NGƯỜI CHƠI CHIBI (16×24, 3 HƯỚNG)',
          sprites: [
            `${playerBase}_down_walk`, `${playerBase}_down_idle`,
            `${playerBase}_up_walk`, `${playerBase}_up_idle`,
            `${playerBase}_side_walk`, `${playerBase}_side_idle`
          ]
        },
        {
          title: '2. 29 TRÁI ÁC QUỶ (LOGIA, PARAMECIA, ZOAN)',
          sprites: Object.keys(S.FRUITS || {}).map(id => `fruit_${id}`)
        },
        {
          title: '3. 13 VŨ KHÍ (KIẾM, GẬY, SÚNG)',
          sprites: Object.keys(S.WEAPONS || {}).map(id => `weapon_${id}`)
        },
        {
          title: '4. 14 ĐỒ DÙNG & VẬT PHẨM (TIÊU HAO, GIÁP, DIAL, HAKI)',
          sprites: Object.keys(S.ITEMS || {}).map(id => `item_${id}`)
        },
        {
          title: '5. BẢN ĐỒ & THẾ GIỚI (TILE, CÂY, NHÀ, RƯƠNG)',
          sprites: [
            'tile_deep', 'tile_shallow', 'tile_sand', 'tile_grass', 'tile_rock',
            'tile_dirt', 'tile_ice', 'tile_snow', 'tile_lava', 'tile_wood', 'tile_bridge', 'tile_dock', 'tile_wall',
            'tree_palm', 'tree_pine', 'tree_jungle',
            'house_small', 'house_wood', 'house_stone',
            'chest_wood', 'chest_iron', 'chest_gold'
          ]
        },
        {
          title: '6. THUYỀN CHIẾN & CHIẾN HẠM',
          sprites: ['boat_dinghy', 'boat_waver', 'boat_sloop', 'boat_warship', 'warship_launch']
        },
        {
          title: '7. HIỆU ỨNG CHIẾN ĐẤU & BIỂU CẢM KHÁN GIẢ',
          sprites: ['fx_slash', 'fx_bullet', 'fx_explosion', 'fx_fire', 'fx_ice', 'fx_spark', 'emote_laugh', 'emote_shock', 'emote_cry', 'emote_clap']
        }
      ];

      const content = document.getElementById('content');

      categories.forEach(cat => {
        const titleEl = document.createElement('div');
        titleEl.className = 'category-title';
        titleEl.innerHTML = `<span>${cat.title}</span> <span>[${cat.sprites.length}]</span>`;
        content.appendChild(titleEl);

        const gridEl = document.createElement('div');
        gridEl.className = 'grid';

        cat.sprites.forEach(sId => {
          const spr = SPR.get(sId);
          if (!spr) return;

          const card = document.createElement('div');
          card.className = 'card';

          const container = document.createElement('div');
          container.className = 'canvas-container';

          const canvas = document.createElement('canvas');
          const frameCvs = spr.frames[0];
          const zoom = Math.min(3, Math.floor(64 / Math.max(spr.w, spr.h))) || 2;

          canvas.width = spr.w * zoom;
          canvas.height = spr.h * zoom;

          const ctx = canvas.getContext('2d');
          ctx.imageSmoothingEnabled = false;
          ctx.drawImage(frameCvs, 0, 0, canvas.width, canvas.height);

          container.appendChild(canvas);
          card.appendChild(container);

          const nameEl = document.createElement('div');
          nameEl.className = 'sprite-name';
          nameEl.textContent = sId;
          card.appendChild(nameEl);

          const sizeEl = document.createElement('div');
          sizeEl.className = 'sprite-size';
          sizeEl.textContent = `${spr.w}×${spr.h}`;
          card.appendChild(sizeEl);

          gridEl.appendChild(card);
        });

        content.appendChild(gridEl);
      });
    });
  </script>
</body>
</html>
