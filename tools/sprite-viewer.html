<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>One Piece Battleground – Bộ Xem Sprite & Palette M03B-T01</title>
  <style>
    @font-face {
      font-family: 'VT323';
      src: url('../client/fonts/VT323.ttf') format('truetype');
    }
    * { box-sizing: border-box; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: 'VT323', monospace;
      font-size: 20px;
      margin: 0;
      padding: 24px;
    }
    h1 {
      font-size: 36px;
      color: #facc15;
      margin-top: 0;
      text-shadow: 2px 2px #000;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .status-bar {
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 6px;
      padding: 16px 20px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .badge-pass {
      background: #15803d;
      color: #f0fdf4;
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 22px;
      font-weight: bold;
    }
    .badge-fail {
      background: #b91c1c;
      color: #fef2f2;
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 22px;
      font-weight: bold;
    }
    .category-title {
      font-size: 28px;
      color: #38bdf8;
      border-bottom: 2px solid #334155;
      padding-bottom: 6px;
      margin-top: 32px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 16px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 6px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.1s, border-color 0.1s;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: #facc15;
      background: #243248;
    }
    .canvas-container {
      width: 72px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #090d16;
      border: 1px solid #334155;
      border-radius: 4px;
      margin-bottom: 8px;
      position: relative;
    }
    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .sprite-name {
      font-size: 16px;
      text-align: center;
      color: #e2e8f0;
      word-break: break-word;
      line-height: 1.1;
    }
    .sprite-size {
      font-size: 14px;
      color: #94a3b8;
      margin-top: 4px;
    }
    .palette-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
      background: #1e293b;
      border-radius: 6px;
      overflow: hidden;
    }
    .palette-table th, .palette-table td {
      padding: 8px 12px;
      border: 1px solid #334155;
      text-align: left;
      font-size: 18px;
    }
    .palette-table th {
      background: #0f172a;
      color: #facc15;
    }
    .color-swatch {
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 1px solid #000;
      border-radius: 3px;
      vertical-align: middle;
      margin-right: 8px;
    }
  </style>

  <!-- Nạp Shared Scripts -->
  <script src="../shared/00-namespace.js"></script>
  <script src="../shared/01-constants.js"></script>
  <script src="../shared/02-enums.js"></script>
  <script src="../shared/03-protocol.js"></script>
  <script src="../shared/04-keybinds.js"></script>
  <script src="../shared/05-rng.js"></script>
  <script src="../shared/10-data-fruits.js"></script>
  <script src="../shared/11-data-weapons.js"></script>
  <script src="../shared/12-data-items.js"></script>
  <script src="../shared/13-data-bosses.js"></script>
  <script src="../shared/14-data-islands.js"></script>
  <script src="../shared/15-data-boats.js"></script>
  <script src="../shared/16-data-zone.js"></script>
  <script src="../shared/20-rules-damage.js"></script>
  <script src="../shared/20-mapgen-layout.js"></script>
  <script src="../shared/21-mapgen.js"></script>

  <!-- Nạp Client Core & Sprites Scripts -->
  <script src="../client/js/00-boot.js"></script>
  <script src="../client/js/02a-pixel-core.js"></script>
  <script src="../client/js/02b-palette.js"></script>
  <script src="../client/js/02c-sprites-chars.js"></script>
  <script src="../client/js/02d-sprites-items.js"></script>
  <script src="../client/js/02e-sprites-world.js"></script>
  <script src="../client/js/02f-sprites-fx.js"></script>
  <script src="../client/js/05b-render-entities.js"></script>
</head>
<body>

  <h1>ONE PIECE BATTLEGROUND – BỘ XEM SPRITE & PALETTE (M03B-T01)</h1>

  <div class="status-bar" id="statusBar">
    <div>Đang nạp và đối chiếu sprite với data...</div>
  </div>

  <div id="paletteSection"></div>
  <div id="content"></div>

  <script>
    window.addEventListener('DOMContentLoaded', function () {
      const OP = window.OP || {};
      const S = window.OP_SHARED || {};
      const SPR = OP.SPR || {};
      const PAL = OP.PAL || {};

      // 1. Kiem tra so khop data
      const missingList = [];
      let checkedCount = 0;

      for (const fId in (S.FRUITS || {})) {
        checkedCount++;
        if (!SPR.get(`fruit_${fId}`)) missingList.push(`fruit_${fId}`);
      }
      for (const wId in (S.WEAPONS || {})) {
        checkedCount++;
        if (!SPR.get(`weapon_${wId}`)) missingList.push(`weapon_${wId}`);
      }
      for (const iId in (S.ITEMS || {})) {
        checkedCount++;
        if (!SPR.get(`item_${iId}`)) missingList.push(`item_${iId}`);
      }
      for (const bId in (S.BOATS || {})) {
        checkedCount++;
        if (!SPR.get(`boat_${bId}`)) missingList.push(`boat_${bId}`);
      }

      // Kiem tra 17 tile co du 3 bien the
      const tileDefs = [
        'deep', 'shallow', 'sand', 'grass', 'dirt', 'stone', 'wall', 'wood',
        'ice', 'lava', 'snow', 'quicksand', 'dock', 'bridge', 'tree', 'house_wall', 'floor'
      ];
      let tileVariantsCount = 0;
      for (let t = 0; t < tileDefs.length; t++) {
        const name = tileDefs[t];
        for (let v = 0; v < 3; v++) {
          if (SPR.get(`tile_${name}_v${v}`)) {
            tileVariantsCount++;
          } else {
            missingList.push(`tile_${name}_v${v}`);
          }
        }
      }

      const statusBar = document.getElementById('statusBar');
      if (missingList.length === 0) {
        statusBar.innerHTML = `
          <div><strong>ĐỐI CHIẾU DỮ LIỆU:</strong> Đã kiểm tra ${checkedCount} đối tượng data + 17 TILE (đủ ${tileVariantsCount} biến thể).</div>
          <div class="badge-pass">TẤT CẢ SPRITE & BIẾN THỂ HỢP LỆ (0 THIẾU)</div>
        `;
      } else {
        statusBar.innerHTML = `
          <div><strong>CẢNH BÁO:</strong> Thiếu ${missingList.length} sprite: ${missingList.join(', ')}</div>
          <div class="badge-fail">THIẾU SPRITE</div>
        `;
      }

      // 2. Bang mau Palette Terrain & Do sang
      const palSec = document.getElementById('paletteSection');
      const ter = PAL.TERRAIN || {};
      let palHtml = `
        <div class="category-title">
          <span>BẢNG MÀU PALETTE 4 TÔNG & ĐỘ SÁNG ĐO ĐƯỢC (W3C LUMINANCE)</span>
          <span>Viền sprite: ${PAL.OUTLINE}</span>
        </div>
        <table class="palette-table">
          <tr>
            <th>Loại vật liệu</th>
            <th>Tông Tối (Shadow)</th>
            <th>Tông Vừa (Mid-tone)</th>
            <th>Tông Sáng (Highlight)</th>
            <th>Điểm nhấn (Accent)</th>
            <th>Độ sáng Mid (Y)</th>
          </tr>
      `;

      for (const key in ter) {
        const item = ter[key];
        const lum = PAL.luminance ? PAL.luminance(item.mid).toFixed(2) : '-';
        palHtml += `
          <tr>
            <td><strong>${item.name || key}</strong> (${key})</td>
            <td><span class="color-swatch" style="background:${item.shadow}"></span>${item.shadow}</td>
            <td><span class="color-swatch" style="background:${item.mid}"></span>${item.mid}</td>
            <td><span class="color-swatch" style="background:${item.high}"></span>${item.high}</td>
            <td><span class="color-swatch" style="background:${item.accent}"></span>${item.accent}</td>
            <td><strong>${lum}</strong></td>
          </tr>
        `;
      }
      palHtml += `</table>`;
      palSec.innerHTML = palHtml;

      // 3. Render danh muc Sprites & Bien the
      const playerBase = SPR.player ? SPR.player({ hat: '#eab308', shirt: '#dc2626', hair: '#18181b' }) : 'p_default';

      // Tao danh sach cac tile kem bien the
      const tileSprites = [];
      tileDefs.forEach(name => {
        tileSprites.push(`tile_${name}_v0`, `tile_${name}_v1`, `tile_${name}_v2`);
      });

      const categories = [
        {
          title: '1. TILE BẢN ĐỒ 17 LOẠI × 3 BIẾN THỂ (V0 CHUẨN, V1 ĐỐM/BỌT, V2 NỨT/RÃNH)',
          sprites: tileSprites
        },
        {
          title: '2. NGƯỜI CHƠI CHIBI KÈM BÓNG ĐỔ ELIP (rgba(0,0,0,.35))',
          sprites: [
            `${playerBase}_down_walk`, `${playerBase}_down_idle`,
            `${playerBase}_up_walk`, `${playerBase}_up_idle`,
            `${playerBase}_side_walk`, `${playerBase}_side_idle`
          ],
          hasShadow: true
        },
        {
          title: '3. 29 TRÁI ÁC QUỶ (LOGIA, PARAMECIA, ZOAN)',
          sprites: Object.keys(S.FRUITS || {}).map(id => `fruit_${id}`)
        },
        {
          title: '4. 13 VŨ KHÍ (KIẾM, GẬY, SÚNG)',
          sprites: Object.keys(S.WEAPONS || {}).map(id => `weapon_${id}`)
        },
        {
          title: '5. 14 ĐỒ DÙNG & VẬT PHẨM (TIÊU HAO, GIÁP, DIAL, HAKI)',
          sprites: Object.keys(S.ITEMS || {}).map(id => `item_${id}`)
        },
        {
          title: '6. CÂY CỐI, NHÀ CỬA & RƯƠNG BÁU KÈM BÓNG ĐỔ',
          sprites: [
            'tree_palm', 'tree_pine', 'tree_jungle',
            'house_small', 'house_wood', 'house_stone',
            'chest_wood', 'chest_iron', 'chest_gold'
          ],
          hasShadow: true
        },
        {
          title: '7. THUYỀN CHIẾN & CHIẾN HẠM KÈM BÓNG ĐỔ',
          sprites: ['boat_dinghy', 'boat_waver', 'boat_sloop', 'boat_warship', 'warship_launch'],
          hasShadow: true
        }
      ];

      const content = document.getElementById('content');

      categories.forEach(cat => {
        const titleEl = document.createElement('div');
        titleEl.className = 'category-title';
        titleEl.innerHTML = `<span>${cat.title}</span> <span>[${cat.sprites.length}]</span>`;
        content.appendChild(titleEl);

        const gridEl = document.createElement('div');
        gridEl.className = 'grid';

        cat.sprites.forEach(sId => {
          const spr = SPR.get(sId);
          if (!spr) return;

          const card = document.createElement('div');
          card.className = 'card';

          const container = document.createElement('div');
          container.className = 'canvas-container';

          const canvas = document.createElement('canvas');
          const frameCvs = spr.frames[0];
          const zoom = Math.min(3, Math.floor(64 / Math.max(spr.w, spr.h))) || 2;

          canvas.width = 64;
          canvas.height = 64;

          const ctx = canvas.getContext('2d');
          ctx.imageSmoothingEnabled = false;

          // Neu co bong do thi ve bong elip o day
          if (cat.hasShadow) {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
            ctx.beginPath();
            const r = Math.round(spr.w * 0.4);
            ctx.ellipse(32, 48, r, Math.round(r * 0.45), 0, 0, Math.PI * 2);
            ctx.fill();
          }

          const drawW = spr.w * zoom;
          const drawH = spr.h * zoom;
          const dx = Math.round((64 - drawW) / 2);
          const dy = Math.round((64 - drawH) / 2);
          ctx.drawImage(frameCvs, dx, dy, drawW, drawH);

          container.appendChild(canvas);
          card.appendChild(container);

          const nameEl = document.createElement('div');
          nameEl.className = 'sprite-name';
          nameEl.textContent = sId;
          card.appendChild(nameEl);

          const sizeEl = document.createElement('div');
          sizeEl.className = 'sprite-size';
          sizeEl.textContent = `${spr.w}×${spr.h}`;
          card.appendChild(sizeEl);

          gridEl.appendChild(card);
        });

        content.appendChild(gridEl);
      });
    });
  </script>
</body>
</html>
